on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2.2.0
        with:
          fetch-depth: 0
      - name: 'Get Previous tag'
        id: get_latest_tag
        uses: "WyriHaximus/github-action-get-previous-tag@v1"
      - name: Test
        run: |
          echo $RELEASE_VERSION
          echo ${{ steps.get_latest_tag.outputs.tag }}
